name: Pre-Commit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".pre-commit-config.yaml"
      - ".upptimerc.yml"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "README.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: kupecloud/github-workflows/.github/workflows/pre-commit.yaml@2404c673db4d398eb4586ac671c4bba301857aa2 # v1.5.1

  deployment-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify production publishing is restricted to main
        run: python3 -m unittest discover -s tests -v
