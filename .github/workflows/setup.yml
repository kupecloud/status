# Maintained locally: template upgrades must preserve reviewed-main deployment guards.
name: Setup CI
on:
  push:
    branches:
      - main
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
permissions:
  contents: write
  # issues: write for incident-issue management + issues.listForRepo;
  # actions: write for the benc-uk/workflow-dispatch step that kicks the
  # other upptime workflows. NOTE: Setup CI also regenerates and pushes
  # .github/workflows/* files, which GITHUB_TOKEN can NEVER push (workflow
  # scope). That step still requires a fine-grained GH_PAT secret — the
  # PAT is the only complete fix (see docs/incident-issues.md).
  issues: write
  actions: write
concurrency:
  group: status-pages-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@c34c41a9fc6fc6852ca94c66ae83f54dbe7063ae # v1.46.1
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@c34c41a9fc6fc6852ca94c66ae83f54dbe7063ae # v1.46.1
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: Graphs CI
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@c34c41a9fc6fc6852ca94c66ae83f54dbe7063ae # v1.46.1
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
