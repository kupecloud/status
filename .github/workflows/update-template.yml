# Upstream's mutating generator removes local deployment guards; upgrades are reviewed.
name: Upptime upgrade guidance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Describe the reviewed upgrade process
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'GUIDANCE'
          Apply Upptime template upgrades on a feature branch and open a reviewed PR.
          Preserve main-only publish guards, pinned action revisions and the secrets allowlist.
          Run deployment guard tests before merging; do not run the upstream push-capable generator against production.
          GUIDANCE
