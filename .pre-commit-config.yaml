minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
        # Upptime emits compact generated JSON; check-json still validates it.
        exclude: ^history/summary\.json$
      - id: trailing-whitespace

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  # Same check as trussworks' markdown-toc hook (markdown-toc 1.2.0, the same
  # appended comment), but with `-` bullets: the Upptime Summary CI rewrites
  # README.md with `-` bullets daily, and trussworks hardcodes `*`, so the two
  # fought and the gate failed on every PR after 28bcc70.
  - repo: local
    hooks:
      - id: markdown-toc
        name: Generate a Table of Contents in Markdown files
        entry: markdown-toc
        language: node
        additional_dependencies:
          - markdown-toc@1.2.0
        args:
          - --bullets=-
          - "--append=\n\n<!-- Regenerate with \"pre-commit run -a markdown-toc\" -->"
          - -i
        files: ^README\.md$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 3766ad839ad3a74558031510b3bc9872bb1d9980
    hooks:
      - id: markdownlint-cli2
        files: ^README\.md$

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
    hooks:
      - id: codespell
        args:
          - --write-changes

  # Production publishing (setup.yml, site.yml) must stay restricted to
  # reviewed main, and the upgrade workflow must stay read-only. This used to be
  # the separate `deployment-guards` CI job (kupecloud/github-workflows#14).
  - repo: local
    hooks:
      - id: deployment-guards
        name: deployment guards (publish only from main)
        entry: python3 -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|tests/)

  # Refuse any commit whose STAGED content contains a secret. Added org-wide on
  # 2026-10-06 after three OpenTofu state files carrying a dev SSH private key
  # and a live Cloudflare Access OAuth client secret were committed to
  # kupe-tests (99e0452) and sat in history for 34 days. gitleaks v8.30.1 flags
  # all of them, so this would have blocked that commit.
  #
  # Chosen over GitHub secret scanning because push protection needs the paid
  # Secret Protection product on private repos ($19/committer/month) and only
  # alerts AFTER the push; this refuses before the commit exists.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
