owner: kupecloud
repo: status

# Allowlist of secrets exposed to the generated workflows' SECRETS_CONTEXT
# (upptime v1.43+, PR #292). Without this the workflows serialize
# toJson(secrets), handing every repo/org secret to the third-party action.
# Names must be uppercase and must not start with GITHUB_ (review LOW-3).
secrets:
  - GH_PAT

i18n:
  footer: ""

sites:
  # Flat list, no "Group | Site" prefixes: every entry is a Kupe service, so a
  # group header adds nothing. kupe.cloud stays monitored because it serves
  # /signup and /alpha, not because it is the marketing site (S-2).
  - name: Website
    url: https://kupe.cloud
  - name: Console
    url: https://console.kupe.cloud
    # Headlamp console: the root redirects unauthenticated users to OIDC login.
    # upptime follows redirects (curl FOLLOWLOCATION, up to 3 hops) and records
    # only the final status, so a 3xx is never the observed code. Assert 200 on
    # the landed page — this proves the SPA shell is served, not backend/OIDC.
    expectedStatusCodes:
      - 200
  - name: Auth
    url: https://auth.kupe.cloud/-/health/live/
    # Authentik's unauthenticated liveness endpoint returns 204 No Content.
    expectedStatusCodes:
      - 200
      - 204
  - name: Grafana
    url: https://grafana.kupe.cloud/api/health
    # Grafana's unauthenticated health endpoint returns 200 with a small JSON body.
    expectedStatusCodes:
      - 200
  - name: Argo CD
    url: https://argocd.kupe.cloud/healthz
    # Tenant-facing, not staff-only: the console's app switcher lists Argo CD
    # next to Grafana (console AppSwitcher.tsx, fed from platformConfig
    # argocdURL) and the Authentik portal links it too. Its outage is also
    # customer-visible even for tenants who never open the UI — Argo is what
    # reconciles their Git against their clusters, so deployments silently stop
    # converging. Monitored separately from Grafana so the status page
    # distinguishes "dashboards are down" from "deployments are not shipping".
    # /healthz is unauthenticated and returns a bare "ok" body.
    expectedStatusCodes:
      - 200
  - name: API
    url: https://api.kupe.cloud/readyz
    # The control plane behind the kupe CLI and the Terraform provider. This was
    # the most serious monitoring gap: an API outage takes every tenant's
    # tooling offline while the status page stayed green. /readyz over /healthz
    # deliberately — readiness is the signal that matters to a caller.
    expectedStatusCodes:
      - 200
  - name: Signup
    url: https://signup.kupe.cloud/readyz
    # If signup breaks nobody can join and there is no other signal that it has.
    # /readyz checks the dependencies that actually make signup work — it
    # returns {"checks":{"authentik":"ok","kubernetes":"ok"}} — so it fails when
    # signup is genuinely unusable, not merely when the process has died.
    expectedStatusCodes:
      - 200
  - name: Docs
    url: https://docs.kupe.cloud
    # Cheap to watch and genuinely customer-facing: docs are where a stuck user
    # goes first, and this site has its own deploy path (Cloudflare Pages) that
    # can fail independently of the platform.
    expectedStatusCodes:
      - 200

status-website:
  cname: status.kupe.cloud
  logoUrl: https://status.kupe.cloud/brand/kupe-wordmark-dark.png
  favicon: https://status.kupe.cloud/brand/kupe-mark-favicon.png
  name: Kupe Status
  theme: dark
  introTitle: "**Kupe Status** — real-time monitoring of Kupe services."
  introMessage: This page shows the current status of Kupe's public services. If you're experiencing issues, check here for updates. Incidents are tracked via [GitHub Issues](https://github.com/kupecloud/status/issues).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  css: |
    :root {
      --body-background-color: #070b14;
      --body-text-color: #edf4f1;
      --card-background-color: #0b1222;
      --card-border-color: rgba(148, 163, 184, 0.18);
      --nav-background-color: #070b14;
      --nav-border-bottom-color: rgba(42, 157, 143, 0.18);
      --nav-current-border-bottom-color: #5ee0c5;
      --card-button-background-color: #5ee0c5;
      --card-button-border-color: #5ee0c5;
      --card-button-text-color: #182e33;
      --card-button-background-color-hover: #8ce9d4;
      --card-button-border-color-hover: #8ce9d4;
      --card-button-text-color-hover: #182e33;
      --down-border-left-color: #f16f6f;
      --down-background-color: rgba(241, 111, 111, 0.12);
      --degraded-border-left-color: #f3b562;
      --up-border-left-color: #4bbf8a;
      --tag-color: #eef4f6;
      --tag-up-background-color: rgba(75, 191, 138, 0.18);
      --tag-down-background-color: rgba(241, 111, 111, 0.16);
      --tag-degraded-background-color: rgba(243, 181, 98, 0.16);
      --change-background-color: rgba(109, 30, 245, 0.08);
      --error-button-border-color: rgba(241, 111, 111, 0.45);
      --error-button-background-color: rgba(241, 111, 111, 0.14);
      --error-button-color: #ffc0c0;
      --submit-button-background-color: #5ee0c5;
      --submit-button-border-color: #5ee0c5;
      --submit-button-color: #182e33;
      --graph-opacity: 0.85;
      --graph-filter: saturate(0.92) brightness(0.9);
      --code-color: #edf4f1;
      --code-background-color: #0b1222;
    }

    body {
      background: var(--body-background-color);
      color: var(--body-text-color);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    a {
      color: #5ee0c5;
    }

    a:hover {
      color: #8ce9d4;
    }

    nav {
      background: #070b14 !important;
      box-shadow: 0 12px 32px rgba(3, 10, 20, 0.35);
    }

    nav .container {
      align-items: center;
      display: grid;
      gap: 0.75rem;
      grid-template-columns: minmax(0, 1fr) auto;
    }

    nav a.logo {
      align-items: center;
      display: inline-flex !important;
      gap: 0.75rem;
      justify-self: start;
      min-width: 0;
      text-decoration: none;
    }

    nav a.logo img {
      height: 3.25rem;
      width: auto;
    }

    nav ul {
      align-items: center;
      display: inline-flex;
      gap: 0.85rem;
      justify-self: end;
      list-style: none;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    nav li {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav ul a {
      font-size: 0.95rem;
      line-height: 1.2;
      padding: 0.2rem 0;
    }

    nav a,
    nav div {
      color: #edf4f1 !important;
    }

    nav a.logo div {
      align-items: baseline;
      color: transparent !important;
      display: inline-flex;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0;
      gap: 0.35rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    nav a.logo div::after {
      content: "Status";
      color: #edf4f1;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.2;
    }

    @media (max-width: 47.99rem) {
      nav .container {
        gap: 0.5rem;
        grid-template-columns: minmax(0, 1fr) auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }

      nav a.logo {
        gap: 0.45rem;
        margin-left: -0.15rem;
      }

      nav a.logo img {
        height: 2.5rem;
      }

      nav a.logo div {
        gap: 0.12rem;
      }

      nav a.logo div::after {
        font-size: 0.95rem;
      }

      nav ul {
        gap: 0.6rem;
      }

      nav ul a {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 465px) {
      nav ul li:last-child {
        display: none;
      }

      nav .container {
        gap: 0.35rem;
      }

      nav a.logo {
        gap: 0.35rem;
      }

      nav a.logo div::after {
        font-size: 0.95rem;
      }
    }

    [aria-current] {
      border-bottom-color: #5ee0c5 !important;
    }

    main > header {
      background: #0b1222;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 1rem;
      box-shadow: 0 18px 40px rgba(4, 13, 24, 0.22);
      color: #f8fafc;
      margin-top: 1.5rem;
      padding: 1.5rem 1.75rem;
    }

    main > header a,
    main > header p,
    main > header strong,
    main > header h1 {
      color: inherit !important;
    }

    .lead,
    h3,
    small {
      color: #b0c7bf !important;
    }

    article {
      background: #0b1222;
      border-color: rgba(148, 163, 184, 0.18);
      box-shadow: 0 18px 40px rgba(4, 13, 24, 0.22);
    }

    .tag {
      border-radius: 999px;
      padding: 0.33rem 0.65rem;
    }

    .tag.closed,
    .tag.up {
      color: #8be0b6;
    }

    .tag.open,
    .tag.down {
      color: #ffc0c0;
    }

    .tag.degraded {
      color: #ffd493;
    }

    .submit-button,
    a.error-button {
      border-radius: 999px;
    }

# See https://upptime.js.org/docs/configuration for more options
